name: PR check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - name: Check for changes after npm i
        shell: bash
        run: "[[ `git status --porcelain` ]] && exit 1 || exit 0"
      - run: npm run build
      - run: npm test
        shell: bash